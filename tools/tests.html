<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<base href="../">
<title>엔진 자체 테스트</title>
<style>
body{margin:0;padding:24px;background:#121212;color:#fff;font:14px/1.6 "Apple SD Gothic Neo","Malgun Gothic",sans-serif}
h1{font-size:20px;margin:0 0 4px}
#sum{margin:0 0 16px;font-weight:800}
.ok{color:#1ed760}.bad{color:#f3727f}
ul{list-style:none;padding:0;margin:0;display:grid;gap:4px}
li{padding:6px 10px;border-radius:8px;background:#1f1f1f}
li small{color:#7c7c7c;margin-left:8px}
</style>
</head>
<body>
<h1>SAME SCENE · DISCOVER · IDOL MAP 엔진 테스트</h1>
<p id="sum">실행 중…</p>
<ul id="out"></ul>
<script src="js/idol-match.js"></script>
<script src="js/idol-recommendation-core.js"></script>
<script src="js/rank-history.js"></script>
<script>
(async function () {
  var IM = window.IdolMatch, R = window.IdolRec, res = [];
  function t(name, fn) {
    try { var r = fn(); res.push([name, r === undefined || r === true, r === true || r === undefined ? '' : String(r)]); }
    catch (e) { res.push([name, false, e.message]); }
  }
  await IM.ready;
  // 저장소는 테스트 동안만 비운다
  var backup = {}; ['idolTierFavorites', 'idolTierRecentDiscoveries', 'idolTierDiscoveryHistory'].forEach(function (k) { backup[k] = localStorage.getItem(k); localStorage.removeItem(k); });
  var KR = R.entitiesOf('KR'), JP = R.entitiesOf('JP');

  t('한국 86팀 / 일본 126팀 엔티티', function () { return KR.length === 86 && JP.length === 126 || KR.length + '/' + JP.length; });
  t('논리 좌표는 0~100 범위이고 결정적', function () {
    var a = R.logicalPoints('KR').points, ok = a.every(function (p) { return p.mapX >= 0 && p.mapX <= 100 && p.mapY >= 0 && p.mapY <= 100 && Math.abs(p.mapY - (100 - p.baseY)) < 1e-9; });
    var again = R.logicalPoints('KR').points; return ok && a === again;
  });
  t('mapSimilarity(설명용): 같은 위치=100, 대각 끝≈0, 좌표 없으면 null(50 아님)', function () {
    var a = { logicalX: 0, logicalY: 0 }, b = { logicalX: 100, logicalY: 100 };
    return R.mapSimilarity(a, a) === 100 && R.mapSimilarity(a, b) < 0.001 && R.mapSimilarity(a, { logicalX: NaN, logicalY: 1 }) === null;
  });
  ['KR', 'JP'].forEach(function (c) {
    t(c + ' SAME SCENE: 자기 제외·같은 나라·TOP3·중복 없음·활동종료 제외', function () {
      var bad = [];
      R.entitiesOf(c).forEach(function (e) {
        var r = R.getSameSceneMatches(c, e.name);
        var names = r.top.concat(r.expand).map(function (m) { return m.group.name; });
        if (r.top.length !== 3) bad.push(e.name + ' top=' + r.top.length);
        if (names.indexOf(e.name) !== -1) bad.push(e.name + ' self');
        if (new Set(names).size !== names.length) bad.push(e.name + ' dup');
        r.top.concat(r.expand).forEach(function (m) {
          if (m.group.country !== c) bad.push(e.name + ' country');
          if (!IM.util.isActive(m.group)) bad.push(e.name + ' ended:' + m.group.name);
          if (m.score < 0 || m.score > 100) bad.push(e.name + ' score');
        });
        r.expand.forEach(function (m) { if (m.score < 65 || m.breakdown.style < 55 || m.breakdown.profile < 45) bad.push(e.name + ' expand-cond'); });
      });
      return bad.length ? bad.slice(0, 4).join(', ') : true;
    });
  });
  t('SAME SCENE 방향성: FRUITS ZIPPER → 카와이 계열', function () {
    var r = R.getSameSceneMatches('JP', 'FRUITS ZIPPER'); return r.top.some(function (m) { return m.tags.indexOf('카와이') !== -1; }) || r.top.map(function (m) { return m.group.name; }).join();
  });
  t('SAME SCENE: 총점만으로 정렬되지 않음(상위 3팀 총점이 최고점 그룹들과 다름)', function () {
    var r = R.getSameSceneMatches('KR', 'Kep1er'); var byTotal = KR.filter(function (e) { return e.name !== 'Kep1er'; }).sort(function (a, b) { return b.total - a.total; }).slice(0, 3).map(function (e) { return e.name; }).join();
    return r.top.map(function (m) { return m.group.name; }).join() !== byTotal;
  });
  t('추천 이유는 최대 2문장', function () { return KR.slice(0, 30).every(function (e) { var r = R.getSameSceneMatches('KR', e.name); return r.top.every(function (m) { return m.reasons.length >= 1 && m.reasons.length <= 2; }); }); });
  t('발견 후보(pool)는 활동중·최애/최근 제외', function () {
    IM.saveFavorite('KR', 'aespa'); R.saveRecentDiscovery(KR.filter(function (e) { return e.name === 'IVE'; })[0].id);
    var p = R.getDiscoverPool('ALL').map(function (e) { return e.key; });
    var ok = p.indexOf('KR|aespa') === -1 && p.indexOf('KR|IVE') === -1 && R.getDiscoverPool('ALL', { ignoreRecent: true }).map(function (e) { return e.key; }).indexOf('KR|IVE') !== -1;
    IM.saveFavorite('KR', 'aespa'); localStorage.removeItem('idolTierRecentDiscoveries'); return ok;
  });
  t('범위(KR/JP) 준수', function () {
    return R.getDiscoverPool('KR').every(function (e) { return e.country === 'KR'; }) && R.getDiscoverPool('JP').every(function (e) { return e.country === 'JP'; });
  });
  t('최근 20개 유지 · 기록 50개 유지', function () {
    for (var i = 0; i < 30; i++) R.saveRecentDiscovery('X-' + i);
    for (var j = 0; j < 60; j++) R.saveDiscoveryHistory({ id: 'X-' + j, mode: 'random', timestamp: Date.now() });
    var ok = R.loadRecentDiscoveries().length === 20 && R.loadDiscoveryHistory().length === 50;
    R.clearDiscoveryHistory(); return ok;
  });
  t('랜덤 100회: 최근 제외가 지켜짐(중복 0)', function () {
    localStorage.removeItem('idolTierRecentDiscoveries'); var seen = [], dup = 0;
    for (var i = 0; i < 100; i++) {
      var r = R.pickDiscovery('random', 'ALL'), id = r.ent.id;
      if (seen.slice(0, 20).indexOf(id) !== -1) dup++;
      R.saveRecentDiscovery(id); seen.unshift(id);
    }
    R.clearDiscoveryHistory(); return dup === 0 || dup;
  });
  t('최애 0~1팀이면 내 취향·확장은 다른 모드로 대체', function () {
    var a = R.pickDiscovery('taste', 'ALL'), b = R.pickDiscovery('expand', 'ALL'); return (a.mode !== 'taste' && b.mode !== 'expand' && a.fellBack && b.fellBack) || a.mode + '/' + b.mode;
  });
  t('내 취향(최애 3팀): 1위 고정 아님 + 최애 제외', function () {
    IM.saveFavorite('KR', 'aespa'); IM.saveFavorite('KR', 'LE SSERAFIM'); IM.saveFavorite('JP', 'FRUITS ZIPPER');
    var seen = {}, favHit = false;
    for (var i = 0; i < 120; i++) { var r = R.pickDiscovery('taste', 'ALL'); seen[r.ent.key] = 1; if (['KR|aespa', 'KR|LE SSERAFIM', 'JP|FRUITS ZIPPER'].indexOf(r.ent.key) !== -1) favHit = true; }
    ['aespa', 'LE SSERAFIM'].forEach(function (n) { IM.saveFavorite('KR', n); }); IM.saveFavorite('JP', 'FRUITS ZIPPER');
    return (!favHit && Object.keys(seen).length >= 6) || (favHit ? 'favorite shown' : Object.keys(seen).length + ' distinct');
  });
  t('HOT: 현재기세 ≥ 80', function () { for (var i = 0; i < 60; i++) { var r = R.pickDiscovery('hot', 'ALL'); if (r.mode === 'hot' && r.ent.momentum < 80) return r.ent.name; } return true; });
  t('자동 모드 비율(최애 0팀: 45/35/20, 2팀 이상: 45/25/20/10)', function () {
    function dist(n) { var c = {}; for (var i = 0; i < 6000; i++) { var m = R.chooseDiscoveryMode(n); c[m] = (c[m] || 0) + 1; } Object.keys(c).forEach(function (k) { c[k] = c[k] / 60; }); return c; }
    var a = dist(0), b = dist(3), near = function (v, x) { return Math.abs(v - x) < 4; };
    return (near(a.random, 45) && near(a.hiddenGem, 35) && near(a.hot, 20) && near(b.taste, 45) && near(b.hiddenGem, 25) && near(b.expand, 20) && near(b.random, 10)) || JSON.stringify([a, b]);
  });
  t('오늘의 아이돌은 같은 날 항상 같은 그룹', function () { return R.pickDiscovery('daily', 'ALL').ent.id === R.pickDiscovery('daily', 'ALL').ent.id; });
  t('공유 링크(discoveryFor)로 그룹 복원', function () { var e = R.discoveryFor('JP-042'); return !!e && e.ent.id === 'JP-042'; });
  t('월간 리포트 집계', function () {
    var now = Date.now(); R.saveDiscoveryHistory({ id: 'KR-001', mode: 'hot', timestamp: now }); R.saveDiscoveryHistory({ id: 'JP-002', mode: 'hiddenGem', timestamp: now });
    var d = new Date(), r = R.getMonthlyReport(d.getFullYear(), d.getMonth()); var ok = r.total === 2 && r.unique === 2 && r.countries.KR === 1 && r.countries.JP === 1; R.clearDiscoveryHistory(); return ok || JSON.stringify(r);
  });
  t('발견 후보에서 무기한 휴지·시즌 종료 그룹 제외', function () {
    var bad = R.getDiscoverPool('ALL', { ignoreRecent: true }).filter(function (e) { return /^(무기한 활동휴지|시즌1 종료|3인 재편 후 장기 공백|활동 확인 필요)/.test(e.status); });
    return bad.length === 0 || bad.map(function (e) { return e.name; }).join();
  });



  /* ---------- ALGORITHM V2 ---------- */
  var U = IM.util;
  var mkG = function (id, tags, vec, extra) {
    return Object.assign({ id: id, name: id, country: 'KR', styleTags: tags, vec: Object.assign({ popularity: null, fandom: null, live: null, digital: null, momentum: null }, vec || {}), activityType: 'unknown', dataConfidence: 1, lineage: '', gen: '' }, extra || {});
  };
  t('결측 component 는 50 점 보너스를 받지 않는다(제외 후 재정규화)', function () {
    var a = U.weightedObservedAverage([U.comp('x', 80, 0.5), U.comp('y', null, 0.5)]);
    return (a.score === 80 && Math.abs(a.coverage - 0.5) < 1e-9 && U.weightedObservedAverage([U.comp('x', null, 1)]).score === null) || JSON.stringify(a);
  });
  t('7개 축 중 4개만 있으면 weight 가 올바르게 재정규화된다', function () {
    var w = IM.defaultWeights, comps = [U.comp('style', 100, w.style), U.comp('live', 100, w.live), U.comp('fandom', 100, w.fandom), U.comp('popularity', 100, w.popularity),
      U.comp('digital', null, w.digital), U.comp('momentum', null, w.momentum), U.comp('activity', null, w.activity)];
    var a = U.weightedObservedAverage(comps); return (Math.abs(a.score - 100) < 1e-9 && Math.abs(a.coverage - 0.80) < 1e-9) || JSON.stringify(a);
  });
  t('스타일/수치 유사도: 데이터가 없으면 null (50 아님)', function () {
    return U.calculateStyleSimilarity([], ['팝']) === null && U.calculateNumericSimilarity(null, 50) === null && U.calculateNumericSimilarity('x', 3) === null && IM.percentileRank(null, [1, 2, 3]) === null && U.toFiniteNumber('') === null && U.toFiniteNumber('7.5') === 7.5;
  });
  t('스타일 3단계: exact 1.0 / 같은 카테고리 ≥ 0.72 / 무관 0', function () {
    return U.tagSimilarity('팝', '팝') === 1 && U.tagSimilarity('청춘', '카와이') >= 0.72 && U.tagSimilarity('힙합', '카와이') === 0 && U.tagSimilarity('록', '얼터너티브') >= 0.8;
  });
  t('태그 동의어 canonicalization (얼터/EDM/락/RNB/알앤비)', function () {
    return U.canonicalTag('얼터') === '얼터너티브' && U.canonicalTag('EDM') === '일렉트로' && U.canonicalTag('락') === '록' && U.canonicalTag('RNB') === 'R&B' && U.canonicalTag('알앤비') === 'R&B';
  });
  t('흔한 태그일수록 specificity(IDF) 가 낮다', function () { return U.idf('팝') < U.idf('서브컬처') && U.idf('퍼포먼스') < U.idf('일렉트로'); });
  t('데이터가 부족한 후보: 결측 축이 점수에 반영되지 않고 coverage 가 낮아진다', function () {
    var src = mkG('S', ['팝'], { popularity: 60, fandom: 60, live: 60, digital: 60, momentum: 60 });
    var tgt = mkG('T', ['팝'], { momentum: 60 });
    var m = U.scoreMatch(src, tgt);
    return (m.breakdown.live === null && m.breakdown.fandom === null && m.coverage < IM.quality.minCoverage + 0.2 && m.coverage < 0.7) || JSON.stringify([m.breakdown, m.coverage]);
  });
  t('coverage 0.55 미만 후보는 TOP 추천 기준에서 탈락', function () {
    var src = mkG('S', ['팝'], { popularity: 60, fandom: 60, live: 60, digital: 60, momentum: 60 }), tgt = mkG('T', [], { momentum: 60 });
    var m = U.scoreMatch(src, tgt); return m.coverage < IM.quality.minCoverage;
  });
  t('결과 신뢰도(confidence)와 유사도 분리 · 보정은 약하게(0.85+0.15c)', function () {
    var src = mkG('S', ['팝'], { popularity: 60, fandom: 60, live: 60, digital: 60, momentum: 60 });
    var hi = U.scoreMatch(src, mkG('B', ['팝'], { popularity: 60, fandom: 60, live: 60, digital: 60, momentum: 60 }, { dataConfidence: 1 }));
    var lo = U.scoreMatch(src, mkG('A', ['팝'], { popularity: 60, fandom: 60, live: 60, digital: 60, momentum: 60 }, { dataConfidence: 0.5 }));
    var sameScore = hi.score === lo.score, ranked = [lo, hi].sort(U.compareResults);
    return (sameScore && lo.confidence < hi.confidence && ranked[0] === hi && Math.abs(hi.rankingScore / hi.raw - (0.85 + 0.15 * hi.confidence)) < 1e-9 && lo.rankingScore / lo.raw > 0.9) || 'confidence handling';
  });
  t('같은 입력이면 항상 같은 순서 · 입력 배열 순서를 뒤집어도 동일', function () {
    var a = IM.getMatches('KR', 'IVE'), b = IM.getMatches('KR', 'IVE');
    var src = IM.getGroup('KR', 'IVE'), tg = IM.getGroups('JP').filter(function (g) { return IM.util.isActive(g); });
    var f = function (list) { return list.map(function (g) { return U.scoreMatch(src, g); }).sort(U.compareResults).slice(0, 15).map(function (m) { return m.group.id; }).join(); };
    return (a.top.map(function (m) { return m.group.id; }).join() === b.top.map(function (m) { return m.group.id; }).join() && f(tg) === f(tg.slice().reverse())) || 'order differs';
  });
  t('MATCH: 최소 품질(58/40/0.55) 통과분만 TOP · 부족하면 안내(notice)', function () {
    var bad = [], notices = 0;
    IM.getGroups('KR').concat(IM.getGroups('JP')).forEach(function (g) {
      var r = IM.getMatches(g.country, g.name); if (!r) return;
      if (r.notice) notices++;
      r.top.forEach(function (m) { if (!m.relaxed && (m.score < 58 || m.breakdown.style < 40 || m.coverage < 0.55)) bad.push(g.name); if (m.relaxed && !r.notice) bad.push(g.name + ':relaxed-no-notice'); });
    });
    return bad.length === 0 || bad.slice(0, 3).join();
  });
  t('SAME SCENE: 점수 구성은 style/profile/momentum/scale 뿐 — 지도 좌표를 다시 세지 않는다', function () {
    var a = R.entityOf('KR', 'aespa'), b = R.entityOf('KR', 'ITZY'), names = R._internals.sceneComponents(a, b).map(function (c) { return c.name; }).join();
    var s1 = R.sceneResult(a, b).score, b2 = Object.assign({}, b, { logicalX: 1, logicalY: 99, mapX: 1, mapY: 99 }), s2 = R.sceneResult(a, b2).score;
    return (names === 'style,profile,momentum,scale' && s1 === s2 && R.SCENE_W.style === 0.45 && R.SCENE_W.profile === 0.35) || names + ' ' + s1 + '/' + s2;
  });
  t('SAME SCENE 4축 profile 은 하나의 거리로 계산', function () {
    var p = { popularity: 50, fandom: 50, live: 50, digital: 50 };
    return R.profileSimilarity(p, p) === 100 && R.profileSimilarity(p, { popularity: 60, fandom: 60, live: 60, digital: 60 }) === 90 && R.profileSimilarity(p, { popularity: 60 }) === null;
  });
  t('세대/계열 보정은 기준을 통과한 뒤에만(스타일이 다른 sister group 은 보정 없음)', function () {
    var a = mkG('A', ['록'], { popularity: 50, fandom: 50, live: 50, digital: 50, momentum: 50 }, { gen: '5세대', totalPercentile: 50 });
    var far = mkG('B', ['청순'], { popularity: 50, fandom: 50, live: 50, digital: 50, momentum: 50 }, { gen: '5세대', totalPercentile: 50 });
    var near = mkG('C', ['록'], { popularity: 50, fandom: 50, live: 50, digital: 50, momentum: 50 }, { gen: '5세대', totalPercentile: 50 });
    return R.sceneResult(a, far).bonus === 0 && R.sceneResult(a, near).bonus === 2;
  });
  t('SAME SCENE 결과에 confidence 와 검증 반영이 있다', function () {
    var r = R.getSameSceneMatches('JP', 'FRUITS ZIPPER'); return r.top.every(function (m) { return m.confidence > 0 && m.confidence <= 1 && typeof m.confidenceLabel === 'string' && m.debug && m.debug.missing; });
  });
  t('DISCOVER 시드 재현(?seed=)', function () {
    R.setSeed(1234); var a = []; for (var i = 0; i < 12; i++) a.push(R.pickDiscovery('random', 'ALL').ent.id);
    R.setSeed(1234); var b = []; for (var j = 0; j < 12; j++) b.push(R.pickDiscovery('random', 'ALL').ent.id); R.setSeed(null);
    return a.join() === b.join() || 'seed not reproducible';
  });
  t('ALL 랜덤: KR/JP 노출이 약 50:50 (팀 수 비율 86:126 아님)', function () {
    R.setSeed(7); var kr = 0, n = 3000; for (var i = 0; i < n; i++) if (R.pickDiscovery('random', 'ALL').ent.country === 'KR') kr++; R.setSeed(null);
    var p = kr / n; return (p > 0.46 && p < 0.54) || 'KR share ' + p.toFixed(3);
  });
  t('노출 페널티: 1/sqrt(1+count)', function () {
    return Math.abs(R.noveltyWeight('X', {}) - 1) < 1e-9 && Math.abs(R.noveltyWeight('X', { X: 3 }) - 0.5) < 1e-9 && R.noveltyWeight('X', { X: 8 }) < R.noveltyWeight('X', { X: 1 });
  });
  t('서로 다른 두 취향의 최애: 평균 중간지대가 아니라 각 최애와 잘 맞는 후보가 상위', function () {
    var f1 = R.entityOf('KR', 'IVE'), f2 = R.entityOf('KR', 'Dreamcatcher'), pool = R.entitiesOf('KR').concat(R.entitiesOf('JP')).filter(function (e) { return e.id !== f1.id && e.id !== f2.id && IM.util.isActive(e); });
    var prof = pool.map(function (e) { return R.profileScoreVs([f1, f2], e); }).filter(Boolean).sort(function (x, y) { return y.raw - x.raw; }).slice(0, 12).map(function (m) { return m.ent.id; });
    var top = function (f) { return pool.map(function (e) { return R.sceneResult(f, e); }).filter(function (m) { return m.score !== null; }).sort(U.compareResults).slice(0, 25).map(function (m) { return m.group.id; }); };
    var t1 = top(f1), t2 = top(f2);
    var hit1 = prof.filter(function (id) { return t1.indexOf(id) !== -1; }).length, hit2 = prof.filter(function (id) { return t2.indexOf(id) !== -1; }).length;
    return (hit1 >= 2 && hit2 >= 2) || hit1 + '/' + hit2;
  });
  t('최애 5팀 이상이고 취향이 갈리면 취향군 A/B 로 분리, 3팀이면 분리 없음', function () {
    var G = function (n) { return IM.getGroup(n[0], n[1]); };
    var six = [['KR', 'IVE'], ['KR', 'TWICE'], ['JP', 'FRUITS ZIPPER'], ['JP', 'PassCode'], ['KR', 'Dreamcatcher'], ['JP', 'INUWASI']].map(G);
    var c = U.clusterFavorites(six), three = U.clusterFavorites(six.slice(0, 3));
    return (three === null && c && c.length === 2 && c[0].members.length >= 2 && c[1].members.length >= 2) || (c ? c.map(function (x) { return x.members.length; }).join() : 'no cluster');
  });
  t('지도 스케일: MAD=0 이어도 IQR → SD 로 fallback, 전부 같으면 0', function () {
    var v = [5, 5, 5, 5, 5, 5, 9, 10, 12], i = R.robustScaleInfo(12, v), same = R.robustScaleInfo(5, [5, 5, 5]);
    return (R.mad(v) === 0 && i.method !== 'MAD' && Math.abs(i.z) > 0.5 && isFinite(i.z) && same.z === 0 && same.method === 'none') || JSON.stringify(i);
  });
  t('지도 실데이터: 좌표가 중앙으로 붕괴하지 않고 logical 은 screen 과 분리', function () {
    return ['KR', 'JP'].every(function (c) {
      var pts = R.logicalPoints(c).points, xs = pts.map(function (p) { return p.logicalX; });
